<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c37">
  <title>そらいろキャッチ</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="app">
    <header><span class="eyebrow">A LITTLE BREAK, A LITTLE PLAY</span><h1>そらいろキャッチ<span>●</span></h1><p>空からのおくりものを、カゴいっぱいに。</p></header>
    <section class="game" aria-label="ボールキャッチゲーム">
      <div class="stats"><div>キャッチ<strong id="score">0</strong></div><div>ベスト<strong id="best">0</strong></div><div>残りチャンス<strong id="lives">♥ ♥ ♥</strong></div></div>
      <div class="field" id="field">
        <canvas id="canvas" aria-label="左右キー、または画面をドラッグしてカゴを操作してください"></canvas>
        <div class="overlay" id="overlay"><div class="badge">✦</div><h2 id="title">キャッチ、できるかな？</h2><p id="message">カゴを左右に動かして<br>落ちてくるボールをキャッチ！</p><button id="start">あそぶ <span>→</span></button></div>
        <span class="field-note">CATCH A LITTLE HAPPINESS</span>
      </div>
      <div class="controls"><button id="left" aria-label="左へ移動">←</button><span>指でスライド / ← → キー</span><button id="right" aria-label="右へ移動">→</button></div>
    </section>
    <footer><span>●</span> 3回落とすまで、何個キャッチできる？</footer>
  </main>
</body>
</html>
